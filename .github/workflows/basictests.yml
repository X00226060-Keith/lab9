name : Lab 9 Basic Tests

on:
  push:
    workflow_dispatch

jobs:
  lab9-basic-tests:
    runs-on: ubuntu latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test 1 - Valid Data
        run: |
          result=$ (bash validate-date.sh "pearse mccarthy" "0892224444")
          echo "$result"
          echo "PASS"

      - name: Test 2 - Invalid Data
        run:
          result=$ (bash validate-date.sh "pearse mccarthy" "08922214444")
          echo "$result"
          echo "FAIL"

      - name: Test 3 - Invalid Data
        run:
          result=$ (bash validate-date.sh "pearse mccarthy longer longer" "0892224444")
          echo "$result"
          echo "FAIL"
